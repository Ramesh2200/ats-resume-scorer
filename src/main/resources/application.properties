# Server Configuration
server.port=8085

# Spring Application Name
spring.application.name=ats-resume-scorer

# Database Configuration (Embedded H2 Database with MySQL Mode for instant out-of-the-box execution)
spring.datasource.url=jdbc:h2:mem:ats_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# To connect to your local standalone MySQL server, uncomment the lines below and adjust password:
# spring.datasource.url=jdbc:mysql://localhost:3306/ats_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization & Order
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth 2.0 Configuration
google.oauth.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# Real Email Delivery Configuration (Spring JavaMailSender with Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio SMS Configuration (Optional)
twilio.account-sid=${TWILIO_ACCOUNT_SID:your-twilio-account-sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+15005550006}
